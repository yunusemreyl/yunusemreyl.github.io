<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<script>document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'</script>
<link rel="preload" as="image" href="images/hero.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee6;--card:#fffdf9;--txt:#14201e;--txt2:#46514e;--mut:#76807c;--line:rgba(20,32,30,.12);--acc:#0e8f84;--on:#fff;--hbg:rgba(243,238,230,.92);--btnbg:rgba(20,32,30,.04);--shadow:0 26px 50px -30px rgba(20,32,30,.4);--orb1:rgba(14,143,132,.16);--orb2:rgba(255,170,90,.18);--ease:cubic-bezier(.22,1,.36,1);--sans:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--pad:clamp(20px,6vw,80px);--r:28px}
[data-theme=dark]{--bg:#0a0f15;--card:#101923;--txt:#e9eff5;--txt2:#b5c0cc;--mut:#8b9aab;--line:rgba(255,255,255,.09);--acc:#4fd1c5;--on:#07100f;--hbg:rgba(10,15,21,.92);--btnbg:rgba(255,255,255,.03);--shadow:0 26px 50px -30px #000;--orb1:rgba(79,209,197,.2);--orb2:rgba(90,120,255,.15)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;overflow-x:clip;scroll-snap-type:y mandatory}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background .5s,color .5s}
a{color:inherit;text-decoration:none}
ul{list-style:none}
img{display:block;max-width:100%}

.orb{position:fixed;z-index:-1;border-radius:50%;pointer-events:none;will-change:transform}
.o1{width:70vmax;height:70vmax;top:-30vmax;left:-25vmax;background:radial-gradient(circle,var(--orb1),transparent 65%);animation:drift1 22s ease-in-out infinite alternate}
.o2{width:60vmax;height:60vmax;bottom:-30vmax;right:-25vmax;background:radial-gradient(circle,var(--orb2),transparent 65%);animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate3d(14vmax,10vmax,0) scale(1.15)}}
@keyframes drift2{to{transform:translate3d(-12vmax,-10vmax,0) scale(1.1)}}
#bar{position:fixed;top:0;left:0;right:0;height:2px;background:var(--acc);transform:scaleX(0);transform-origin:left;z-index:90}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;justify-content:space-between;align-items:center;padding:12px var(--pad);background:var(--hbg);border-bottom:1px solid transparent;transition:border-color .3s,background .5s}
header.s{border-color:var(--line)}
.logo{font-weight:700;letter-spacing:.2em;display:flex;align-items:center;gap:12px}
#dock{width:38px;height:38px;flex:none}
.logo b{font-weight:700;opacity:0;will-change:transform,opacity}
.logo i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
nav{display:flex;align-items:center;gap:26px}
nav a{font-size:.88rem;color:var(--mut);position:relative;transition:color .25s}
nav a::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:1px;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
nav a:hover{color:var(--txt)}nav a:hover::after{transform:scaleX(1)}
.tools{display:flex;gap:6px;align-items:center}
.lang{display:flex;gap:4px}
.lang button,.tg{background:none;border:1px solid var(--line);border-radius:10px;color:var(--mut);font:600 .72rem var(--sans);padding:6px 9px;cursor:pointer;transition:.25s}
.tg{font-size:.95rem;line-height:1;padding:5px 9px}
.lang button.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.tg:hover,.lang button:hover{border-color:var(--acc);color:var(--acc)}
.lang button.on:hover{color:var(--on)}
#burger{display:none;width:44px;height:44px;background:none;border:0;cursor:pointer;position:relative}
#burger i{position:absolute;left:11px;right:11px;height:2px;background:var(--txt);border-radius:2px;transition:transform .4s var(--ease),top .4s var(--ease)}
#burger i:nth-child(1){top:17px}#burger i:nth-child(2){top:25px}
#burger.open i:nth-child(1){top:21px;transform:rotate(45deg)}
#burger.open i:nth-child(2){top:21px;transform:rotate(-45deg)}
#menu{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 var(--pad);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
#menu.open{opacity:1;visibility:visible}
#menu a{font-size:clamp(2rem,10vw,3rem);font-weight:600;letter-spacing:-.02em;opacity:0;transform:translateY(24px);transition:opacity .5s,transform .6s var(--ease)}
#menu.open a{opacity:1;transform:none}
#menu.open a:nth-child(2){transition-delay:.06s}#menu.open a:nth-child(3){transition-delay:.12s}#menu.open a:nth-child(4){transition-delay:.18s}
#menu .tools{margin-top:28px}
@media(max-width:900px){nav>a,nav>.tools{display:none}#burger{display:block}}

/* slides */
.slide{min-height:100vh;min-height:100svh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center;padding:92px 0 56px}
.slide>.wrap{width:100%}
.wrap{max-width:1240px;margin:auto;padding:0 var(--pad)}
.rv{opacity:0;transform:translate3d(0,44px,0) scale(.97);transition:opacity .7s var(--ease) var(--d,0s),transform .95s var(--ease) var(--d,0s)}
.slide.act .rv{opacity:1;transform:none}
#dots{position:fixed;right:clamp(6px,1.6vw,22px);top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:4px}
#dots button{width:22px;height:22px;background:none;border:0;cursor:pointer;position:relative}
#dots button::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--mut);opacity:.5;transition:transform .4s var(--ease),background .3s,opacity .3s}
#dots button.on::after{background:var(--acc);opacity:1;transform:scale(1.9)}

/* images: zoom-out on slide entry */
.zoom{position:relative;overflow:hidden;border-radius:var(--r);background:var(--card)}
.zoom img{width:100%;height:100%;object-fit:cover;transform:scale(1.18);transition:transform 1.9s var(--ease)}
.slide.act .zoom img{transform:none}

/* type */
.lbl{font-size:.78rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
h1{font-size:clamp(2.5rem,6.4vw,5.4rem);line-height:1.02;letter-spacing:-.04em;font-weight:700}
h2{font-size:clamp(1.8rem,4vw,3.1rem);line-height:1.1;letter-spacing:-.03em;font-weight:700;margin-bottom:22px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:.88rem;background:var(--btnbg);transition:transform .35s var(--ease),border-color .3s,background .3s,color .3s}
.btn:hover{transform:translateY(-3px);border-color:var(--acc);color:var(--acc)}
.btn.main{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.main:hover{filter:brightness(1.1);color:var(--on)}

/* hero */
#hero{padding:100px 0 84px}
.hero-in{max-width:1240px;margin:auto;padding:0 var(--pad);width:100%;position:relative;z-index:2;color:#fff}
.hero-in>div{max-width:680px}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:40% center;z-index:0;animation:bgzoom 2.4s var(--ease) both}
@keyframes bgzoom{from{transform:scale(1.14)}}
#hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(5,10,12,.82),rgba(5,10,12,.45) 60%,rgba(5,10,12,.3)),linear-gradient(0deg,rgba(5,10,12,.6),transparent 40%)}
#hero .mq{z-index:2;border-color:rgba(255,255,255,.18)}
#hero .mq span{color:rgba(255,255,255,.7)}
#hero .btn:not(.main){color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
#hero .btn:not(.main):hover{border-color:#7ae6dc;color:#7ae6dc}
header:not(.s){background:transparent}
header:not(.s) nav>a,header:not(.s) .tg,header:not(.s) .lang button:not(.on){color:#fff;border-color:rgba(255,255,255,.3)}
header:not(.s) #burger i{background:#fff}
.role{font-size:.78rem;font-weight:600;letter-spacing:.16em;color:#7ae6dc;margin-bottom:14px;animation:up .9s .15s var(--ease) both}
h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
h1 .ln span{display:block;animation:rise 1.1s var(--ease) both}
h1 .ln:nth-child(1) span{animation-delay:.25s}
h1 .ln:nth-child(2) span{animation-delay:.38s;color:rgba(255,255,255,.65);font-weight:500}
@keyframes rise{from{transform:translate3d(0,110%,0)}}
@keyframes up{from{opacity:0;transform:translate3d(0,20px,0)}}
@keyframes wipe{from{clip-path:inset(100% 0 0 0 round var(--r))}}
.lead{max-width:520px;color:rgba(255,255,255,.85);margin:20px 0 28px;font-size:clamp(.96rem,1.25vw,1.1rem);animation:up 1s .55s var(--ease) both}
.hero-in .btns{animation:up 1s .7s var(--ease) both}
.ph{width:clamp(84px,9vw,124px);aspect-ratio:1;visibility:hidden;margin-bottom:22px}
#av{position:fixed;top:0;left:0;z-index:85;display:block;transform-origin:0 0;will-change:transform;animation:fade 1.1s .6s both}
@keyframes fade{from{opacity:0}}
#av::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--acc),transparent 40%,transparent 60%,#5a78ff,var(--acc));animation:spin 8s linear infinite;will-change:transform}
#av img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:50%;border:5px solid var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.ph{width:84px;margin-bottom:14px}.lead{margin:14px 0 20px}}

/* marquee */
.mq{position:absolute;z-index:2;left:0;right:0;bottom:0;overflow:hidden;border-top:1px solid var(--line);padding:14px 0}
.mq div{display:flex;width:max-content;animation:mq 32s linear infinite}
.mq span{padding:0 26px;font-size:.78rem;letter-spacing:.22em;color:var(--mut);white-space:nowrap}
.mq span.d{padding:0;color:var(--acc)}
@keyframes mq{to{transform:translate3d(-50%,0,0)}}

/* about */
.split{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(24px,5vw,72px);align-items:center}
.split .zoom{height:clamp(300px,66svh,600px);box-shadow:var(--shadow)}
.split p{color:var(--txt2);margin-bottom:14px}
.split p b{color:var(--txt);font-weight:600}
@media(max-width:820px){.split{grid-template-columns:1fr;gap:20px}.split .zoom{height:clamp(150px,26svh,280px)}.split h2{margin-bottom:12px}}

/* facts */
.banner{height:clamp(130px,30svh,300px);margin-bottom:16px;box-shadow:var(--shadow)}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,12,14,.72),rgba(6,12,14,.1))}
.banner p{position:absolute;z-index:2;left:clamp(20px,4vw,48px);bottom:clamp(16px,3vw,36px);color:#fff;font-weight:700;font-size:clamp(1.3rem,3.6vw,2.8rem);letter-spacing:-.03em;line-height:1.1}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:820px){.facts{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;transition:transform .45s var(--ease),border-color .3s,background .5s}
@media(hover:hover){.card:hover{transform:translateY(-6px);border-color:var(--acc)}}
.fact b{display:block;font-size:clamp(1.3rem,2.6vw,2rem);letter-spacing:-.03em;line-height:1.2}
.fact span{font-size:.76rem;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}

/* projects */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr;gap:12px}}
.pcard{position:relative;overflow:hidden;padding:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.pimg{height:clamp(130px,27svh,270px);border-radius:0}
.pimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 45%)}
.no{position:absolute;z-index:2;right:18px;top:10px;font-size:2.4rem;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.8)}
.tag{position:absolute;z-index:2;left:16px;top:16px;font-size:.7rem;font-weight:600;letter-spacing:.14em;color:#fff;padding:5px 12px;background:rgba(0,0,0,.45);border-radius:999px}
.pbody{padding:20px 24px 24px}
.pcard h3{font-size:1.35rem;letter-spacing:-.02em;margin-bottom:10px}
.pcard dl div{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.9rem}
.pcard dt{font-size:.68rem;font-weight:600;letter-spacing:.12em;color:var(--acc);text-transform:uppercase;padding-top:3px}
.pcard dd{color:var(--txt2)}
.pcard dd.m{color:var(--mut)}
@media(hover:hover){.slide.act .pcard:hover .zoom img{transform:scale(1.07);transition-duration:1s}}
@media(max-width:820px){.pcard dl div:nth-child(2){display:none}.pbody{padding:14px 18px 16px}.pcard h3{font-size:1.15rem;margin-bottom:6px}.no{font-size:1.9rem}.pcard dl div{padding:7px 0;font-size:.85rem}}

/* skills */
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.cols h4{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:10px}
.cols li{padding:10px 0;border-top:1px solid var(--line);transition:transform .35s var(--ease),color .3s}
@media(hover:hover){.cols li:hover{transform:translateX(8px);color:var(--acc)}}
.note{margin-top:18px;padding:22px 26px;border-radius:22px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);color:var(--txt2);max-width:780px}
.note b{color:var(--txt)}

/* contact */
#contact{padding-bottom:84px}
.cpanel{min-height:clamp(320px,62svh,540px);display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(24px,4.5vw,64px);color:#fff;box-shadow:var(--shadow)}
.cpanel>img{position:absolute;inset:0}
.cpanel::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,10,12,.85),rgba(5,10,12,.25) 70%)}
.cpanel>*:not(img){position:relative;z-index:2}
.cpanel .lbl{color:#7ae6dc}
.big{font-size:clamp(2.2rem,7vw,5.4rem);line-height:1.04;letter-spacing:-.04em;font-weight:700;margin-bottom:14px}
.sub{color:rgba(255,255,255,.8);max-width:520px;margin-bottom:24px}
.cpanel .btn{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
.cpanel .btn.main{background:#4fd1c5;border-color:#4fd1c5;color:#07100f}
footer{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px var(--pad);font-size:.74rem;letter-spacing:.1em;color:var(--mut)}

.loc{display:inline-flex;align-items:center;gap:10px}
.loc svg{color:var(--acc)}
.loc b{font-weight:600;color:var(--txt)}
.loc em{font-style:normal}
.loc i{width:4px;height:4px;border-radius:50%;background:var(--acc)}
[dir=rtl] .mq div,[dir=rtl] #bar{direction:ltr}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .slide .rv{opacity:1;transform:none}.zoom img{transform:none!important}
}
</style>
</head>

<section id="projects2" class="slide"><div class="wrap">

/* slides: stagger children, mark active slide, dots */
const slides=[...document.querySelectorAll(".slide")];
slides.forEach(s=>[...s.querySelectorAll(".rv")].forEach((e,i)=>{if(!e.style.getPropertyValue("--d"))e.style.setProperty("--d",(i*.09)+"s")}));
const dots=document.createElement("div");dots.id="dots";
slides.forEach((s,i)=>{const b=document.createElement("button");b.setAttribute("aria-label","Slide "+(i+1));b.onclick=()=>s.scrollIntoView({behavior:"smooth"});dots.appendChild(b)});
document.body.appendChild(dots);
const io=new IntersectionObserver(es=>es.forEach(e=>{
  e.target.classList.toggle("act",e.isIntersecting);
  if(e.isIntersecting)[...dots.children].forEach((b,i)=>b.classList.toggle("on",slides[i]===e.target));
}),{rootMargin:"-45% 0px -45% 0px",threshold:0});
slides.forEach(s=>io.observe(s));

/* counters */
const co=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;co.unobserve(e.target);
  const n=+e.target.dataset.count,t0=performance.now();
  (function f(t){const k=Math.min(1,(t-t0)/1500);e.target.textContent=Math.round(n*(1-Math.pow(1-k,4))).toLocaleString('tr-TR');if(k<1)requestAnimationFrame(f)})(t0)}),{threshold:.6});
document.querySelectorAll('.cnt').forEach(e=>co.observe(e));

/* progress bar + header border */
const bar=document.getElementById('bar'),hd=document.getElementById('hd');
let tick=false;
function onScroll(){
  const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
  bar.style.transform='scaleX('+(max>0?y/max:0)+')';
  hd.classList.toggle('s',y>10);
  tick=false;
}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});
onScroll();

/* avatar: flies from hero image corner to header (transform only) */
const av=document.getElementById("av"),ph=document.getElementById("ph"),dock=document.getElementById("dock"),lw=document.getElementById("lw");
let M={};
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function measure(){
  av.style.transform="none";
  const r=ph.getBoundingClientRect(),d=dock.getBoundingClientRect();
  M={x0:r.left,y0:r.top+scrollY,x1:d.left,y1:d.top,s:d.width/r.width};
  av.style.width=r.width+"px";av.style.height=r.width+"px";
  M.D=Math.max(200,Math.min(innerHeight*.6,M.y0));
  place();
}
function place(){
  const y=scrollY,p=Math.min(1,y/M.D),e=ease(p);
  const nat=M.y0-y,x=M.x0+(M.x1-M.x0)*e,yy=nat+(M.y1-nat)*e,s=1+(M.s-1)*e;
  av.style.transform="translate3d("+x+"px,"+yy+"px,0) scale("+s+")";
  lw.style.opacity=Math.max(0,(p-.6)/.4);
  lw.style.transform="translate3d("+(-10*(1-p))+"px,0,0)";
}
addEventListener("scroll",()=>requestAnimationFrame(place),{passive:true});
addEventListener("resize",measure);
addEventListener("load",measure);
if(document.fonts)document.fonts.ready.then(measure);
measure();

    const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px');
  },{passive:true}));
}
